<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>VAST UNIVERSE AR</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; font-family: Arial, "Noto Sans KR", sans-serif; }
    a-scene { position: fixed !important; inset: 0; }
    .ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
    .intro { position: absolute; inset: 0; display: grid; place-items: center; padding: 28px; background: #000; pointer-events: auto; transition: opacity .35s ease, visibility .35s ease; }
    .intro.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .card { width: min(430px, 100%); text-align: center; }
    .eyebrow { margin: 0 0 14px; color: #ffd400; font-size: 13px; font-weight: 800; letter-spacing: .22em; }
    h1 { margin: 0 0 12px; font-size: clamp(32px, 10vw, 52px); line-height: .91; letter-spacing: -.055em; }
    .guide { margin: 0 auto 24px; max-width: 330px; color: #b9b9b9; font-size: 15px; line-height: 1.55; word-break: keep-all; }
    button { width: 100%; border: 0; border-radius: 999px; padding: 17px 22px; background: #ffd400; color: #050505; font: inherit; font-size: 16px; font-weight: 850; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .privacy { margin: 14px 0 0; color: #686868; font-size: 11px; }
    .status { position: absolute; left: 50%; bottom: max(25px, env(safe-area-inset-bottom)); translate: -50% 0; min-width: 220px; max-width: calc(100% - 40px); padding: 12px 18px; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; background: rgba(0,0,0,.68); color: white; text-align: center; font-size: 13px; font-weight: 700; letter-spacing: -.01em; backdrop-filter: blur(10px); opacity: 0; transition: opacity .25s ease, border-color .25s ease; }
    .status.show { opacity: 1; }
    .status.found { border-color: rgba(255,212,0,.75); color: #ffd400; }
    .flash { position: absolute; inset: 0; background: white; opacity: 0; mix-blend-mode: screen; }
    .flash.play { animation: flash .48s ease-out; }
    @keyframes flash { 0% { opacity: 0; } 18% { opacity: .2; } 100% { opacity: 0; } }
    .error { color: #ff7777; }
  </style>
</head>
<body>
  <div class="ui">
    <section class="intro" id="intro">
      <div class="card">
        <p class="eyebrow">VAST UNIVERSE</p>
        <h1>HIDDEN<br>REALITY</h1>
        <p class="guide">카메라를 시작한 뒤, 노란 얼굴이 있는 첫 번째 포스터 전체가 화면에 들어오도록 비춰주세요.</p>
        <button type="button" id="startButton">카메라 시작</button>
        <p class="privacy">별도 앱 설치 없이 브라우저에서 실행됩니다.</p>
      </div>
    </section>
    <div class="status" id="status" aria-live="polite">포스터 전체를 비춰주세요</div>
    <div class="flash" id="flash"></div>
  </div>

  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; warmupTolerance: 5; missTolerance: 5; filterMinCF: 0.001; filterBeta: 0.01"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>
    <a-assets timeout="15000">
      <img id="revealImage" src="./assets/reveal.png" crossorigin="anonymous">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="posterTarget" mindar-image-target="targetIndex: 0">
      <a-image
        id="reveal"
        src="#revealImage"
        position="0 0 0.012"
        width="1"
        height="1.41438"
        material="shader: flat; transparent: true; opacity: 0; alphaTest: 0.01"
        animation__show="property: material.opacity; from: 0; to: 1; dur: 700; easing: easeOutQuad; startEvents: reveal"
        animation__hide="property: material.opacity; from: 1; to: 0; dur: 180; easing: linear; startEvents: conceal">
      </a-image>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('#arScene');
    const target = document.querySelector('#posterTarget');
    const reveal = document.querySelector('#reveal');
    const intro = document.querySelector('#intro');
    const startButton = document.querySelector('#startButton');
    const status = document.querySelector('#status');
    const flash = document.querySelector('#flash');

    const setStatus = (message, found = false) => {
      status.textContent = message;
      status.classList.add('show');
      status.classList.toggle('found', found);
      status.classList.remove('error');
    };

    const showError = (message) => {
      intro.classList.remove('hidden');
      startButton.disabled = false;
      startButton.textContent = '다시 시도';
      status.textContent = message;
      status.classList.add('show', 'error');
      status.classList.remove('found');
    };

    const startAR = async () => {
      startButton.disabled = true;
      startButton.textContent = '카메라 준비 중…';
      try {
        if (!scene.hasLoaded) {
          await new Promise((resolve) => scene.addEventListener('loaded', resolve, { once: true }));
        }
        const system = scene.systems['mindar-image-system'];
        if (!system) throw new Error('AR system unavailable');
        await system.start();
        intro.classList.add('hidden');
        setStatus('포스터 전체를 비춰주세요');
      } catch (error) {
        console.error(error);
        showError('카메라 권한을 허용하고 다시 시도해주세요');
      }
    };

    startButton.addEventListener('click', startAR);

    target.addEventListener('targetFound', () => {
      reveal.emit('reveal');
      setStatus('숨겨진 장면을 찾았습니다', true);
      flash.classList.remove('play');
      void flash.offsetWidth;
      flash.classList.add('play');
      setTimeout(() => status.classList.remove('show'), 1500);
    });

    target.addEventListener('targetLost', () => {
      reveal.emit('conceal');
      setTimeout(() => setStatus('포스터 전체를 비춰주세요'), 220);
    });

    scene.addEventListener('arError', () => {
      showError('카메라를 열 수 없습니다. 브라우저의 카메라 권한을 확인해주세요');
    });
  </script>
</body>
</html>
