<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>VAST UNIVERSE AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #startOverlay {
      position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:16px; background:#000; color:#fff;
      font-family:Arial,sans-serif; text-align:center; padding:24px;
    }
    #startBtn {
      border:0; border-radius:999px; padding:16px 28px; font-size:18px;
      font-weight:700; cursor:pointer;
    }
    #msg { font-size:14px; line-height:1.5; opacity:.8; max-width:320px; }
  </style>
</head>
<body>
  <div id="startOverlay">
    <div style="font-size:22px;font-weight:700;">VAST UNIVERSE AR</div>
    <button id="startBtn">카메라 시작</button>
    <div id="msg">버튼을 누른 뒤 카메라 권한을 허용하고 원본 포스터를 비춰주세요.</div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: yes; uiScanning: yes; uiError: yes;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="resultImage" src="./result.png" crossorigin="anonymous" />
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-plane
        src="#resultImage"
        position="0 0 0.01"
        rotation="0 0 0"
        width="1"
        height="1.414"
        material="shader: flat; transparent: true">
      </a-plane>
    </a-entity>
  </a-scene>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const sceneEl = document.querySelector('a-scene');
      const overlay = document.getElementById('startOverlay');
      const startBtn = document.getElementById('startBtn');
      const msg = document.getElementById('msg');
      let arSystem = null;

      sceneEl.addEventListener('loaded', () => {
        arSystem = sceneEl.systems['mindar-image-system'];
      });

      sceneEl.addEventListener('arReady', () => {
        overlay.style.display = 'none';
      });

      sceneEl.addEventListener('arError', () => {
        overlay.style.display = 'flex';
        msg.textContent = '카메라를 시작하지 못했습니다. 브라우저의 카메라 권한을 허용한 뒤 새로고침해 주세요.';
      });

      startBtn.addEventListener('click', async () => {
        if (!arSystem) {
          msg.textContent = 'AR 엔진을 불러오는 중입니다. 1초 뒤 다시 눌러주세요.';
          return;
        }
        startBtn.disabled = true;
        msg.textContent = '카메라를 시작하는 중...';
        try {
          await arSystem.start();
        } catch (e) {
          startBtn.disabled = false;
          msg.textContent = '카메라 실행에 실패했습니다. Safari/Chrome의 카메라 권한을 확인해 주세요.';
        }
      });
    });
  </script>
</body>
</html>
